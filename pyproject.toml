[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "cfgzip"
dynamic = ["version"]
description = "Token vocabulary compression for constrained LLM decoding"
readme = "README-pypi.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "torch",
    "transformers",
    "interegular",
    "tqdm",
    "psutil",
]

[project.optional-dependencies]
xgrammar = ["xgrammar"]
dev = [
    "pytest",
    "xgrammar",
]

[project.urls]
Homepage = "https://github.com/mjs227/cfgzip"
Repository = "https://github.com/mjs227/cfgzip"

[tool.maturin]
bindings = "bin"
python-packages = ["cfgzip"]
exclude = [
    { path = "MAINTAINING.md", format = "sdist" },
    { path = "dist/**/*", format = "sdist" },
]
